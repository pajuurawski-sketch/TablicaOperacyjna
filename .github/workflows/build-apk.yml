name: Budowanie aplikacji APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ustaw Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Przygotuj pliki aplikacji
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p www extracted
          ZIP_FILE="$(find . -maxdepth 5 -type f -iname '*.zip' ! -path './.git/*' -print -quit)"
          if [ -n "$ZIP_FILE" ]; then
            echo "Rozpakowuję: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d extracted
            HTML_FILE="$(find extracted -type f -iname 'index.html' -print -quit)"
          else
            HTML_FILE="$(find . -maxdepth 6 -type f -iname 'index.html' ! -path './www/*' ! -path './extracted/*' ! -path './.git/*' -print -quit)"
          fi
          if [ -z "${HTML_FILE:-}" ] || [ ! -f "$HTML_FILE" ]; then
            echo "::error::Nie znaleziono index.html w repozytorium ani archiwum ZIP."
            find . -maxdepth 5 -type f -print
            exit 1
          fi
          cp "$HTML_FILE" www/index.html
          echo "Użyto pliku: $HTML_FILE"
          ls -lh www/index.html

      - name: Utwórz projekt Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/app
          npm install --save-dev @capacitor/cli
          npx cap init "Tablica operacyjna" "pl.pajurawski.tablicaoperacyjna" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Dodaj właściwą ikonę i obsługę Android TV
        shell: bash
        run: |
          set -euo pipefail
          APP_RES="android/app/src/main/res"
          mkdir -p "$APP_RES/drawable"

          # ZIP zawiera pełny projekt źródłowy. Kopiujemy z niego zasoby ikon,
          # zamiast ograniczać się do samego index.html.
          SOURCE_RES="$(find extracted -type d -path '*/app/src/main/res' -print -quit)"
          if [ -z "$SOURCE_RES" ]; then
            echo "::error::Nie znaleziono zasobów Androida w rozpakowanym ZIP-ie."
            exit 1
          fi

          for DIR in "$SOURCE_RES"/mipmap-*; do
            if [ -d "$DIR" ]; then
              cp -a "$DIR" "$APP_RES/"
            fi
          done

          if [ ! -f "$SOURCE_RES/drawable/tv_banner.png" ]; then
            echo "::error::Brak drawable/tv_banner.png w projekcie ZIP."
            exit 1
          fi
          cp "$SOURCE_RES/drawable/tv_banner.png" "$APP_RES/drawable/tv_banner.png"

          # Dodajemy launcher Android TV do manifestu wygenerowanego przez Capacitor.
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          ns = '{http://schemas.android.com/apk/res/android}'
          tree = ET.parse(p)
          root = tree.getroot()

          def ensure_feature(name):
              for e in root.findall('uses-feature'):
                  if e.get(ns + 'name') == name:
                      e.set(ns + 'required', 'false')
                      return
              ET.SubElement(root, 'uses-feature', {ns + 'name': name, ns + 'required': 'false'})

          ensure_feature('android.software.leanback')
          ensure_feature('android.hardware.touchscreen')

          app = root.find('application')
          if app is None:
              raise SystemExit('Brak elementu application w AndroidManifest.xml')
          app.set(ns + 'icon', '@mipmap/ic_launcher')
          app.set(ns + 'roundIcon', '@mipmap/ic_launcher_round')
          app.set(ns + 'banner', '@drawable/tv_banner')

          activities = app.findall('activity')
          if not activities:
              raise SystemExit('Brak aktywności w AndroidManifest.xml')
          main = None
          for activity in activities:
              for intent in activity.findall('intent-filter'):
                  actions = [x.get(ns + 'name') for x in intent.findall('action')]
                  cats = [x.get(ns + 'name') for x in intent.findall('category')]
                  if 'android.intent.action.MAIN' in actions and 'android.intent.category.LAUNCHER' in cats:
                      main = activity
                      break
              if main is not None:
                  break
          if main is None:
              main = activities[0]
          main.set(ns + 'icon', '@mipmap/ic_launcher')
          main.set(ns + 'banner', '@drawable/tv_banner')
          main.set(ns + 'label', 'Tablica operacyjna')

          has_tv = False
          for intent in main.findall('intent-filter'):
              actions = [x.get(ns + 'name') for x in intent.findall('action')]
              cats = [x.get(ns + 'name') for x in intent.findall('category')]
              if 'android.intent.action.MAIN' in actions and 'android.intent.category.LEANBACK_LAUNCHER' in cats:
                  has_tv = True
                  break
          if not has_tv:
              intent = ET.SubElement(main, 'intent-filter')
              ET.SubElement(intent, 'action', {ns + 'name': 'android.intent.action.MAIN'})
              ET.SubElement(intent, 'category', {ns + 'name': 'android.intent.category.LEANBACK_LAUNCHER'})

          tree.write(p, encoding='utf-8', xml_declaration=True)
          print('Manifest Android TV poprawiony:', p)
          PY

          echo "Ikony skopiowane z: $SOURCE_RES"
          find "$APP_RES" -maxdepth 2 -type f \( -name 'ic_launcher.png' -o -name 'tv_banner.png' \) -print

      - name: Włącz pełny ekran Android (ukryj pasek statusu i nawigacji)
        shell: bash
        run: |
          set -euo pipefail
          MAIN_ACTIVITY="$(find android/app/src/main/java -type f -name 'MainActivity.java' -print -quit)"
          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "::error::Nie znaleziono MainActivity.java"
            exit 1
          fi
          PACKAGE="$(sed -n 's/^package \(.*\);/\1/p' "$MAIN_ACTIVITY" | head -n 1)"
          cat > "$MAIN_ACTIVITY" <<EOF
          package $PACKAGE;

          import android.os.Bundle;
          import android.view.View;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  hideSystemUI();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemUI();
              }

              private void hideSystemUI() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );
              }
          }
          EOF

      - name: Zbuduj APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Udostępnij APK
        uses: actions/upload-artifact@v4
        with:
          name: Tablica-operacyjna-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
