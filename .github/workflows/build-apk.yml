name: Budowanie aplikacji APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rozpakuj projekt
        run: |
          unzip TablicaOperacyjnaAndroid_projekt.zip
          ls -la TablicaOperacyjnaAndroid

      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Zbuduj APK
        working-directory: TablicaOperacyjnaAndroid
        run: gradle --no-daemon assembleDebug

      - name: Udostępnij APK
        uses: actions/upload-artifact@v4
        with:
          name: TablicaOperacyjna
          path: TablicaOperacyjnaAndroid/app/build/outputs/apk/debug/app-debug.apk
