name: Budowanie aplikacji APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ustaw Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Przygotuj pliki aplikacji
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p www extracted
          ZIP_FILE="$(find . -maxdepth 5 -type f -iname '*.zip' ! -path './.git/*' -print -quit)"
          if [ -n "$ZIP_FILE" ]; then
            echo "Rozpakowuję: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d extracted
            HTML_FILE="$(find extracted -type f -iname 'index.html' -print -quit)"
          else
            HTML_FILE="$(find . -maxdepth 6 -type f -iname 'index.html' ! -path './www/*' ! -path './extracted/*' ! -path './.git/*' -print -quit)"
          fi
          if [ -z "${HTML_FILE:-}" ] || [ ! -f "$HTML_FILE" ]; then
            echo "::error::Nie znaleziono index.html."
            exit 1
          fi
          cp "$HTML_FILE" www/index.html
          echo "Użyto pliku: $HTML_FILE"

          ICON_FILE="$(find extracted -type f -path '*/res/mipmap-nodpi/ic_launcher.png' -print -quit)"
          if [ -z "$ICON_FILE" ]; then
            ICON_FILE="$(find extracted -type f -name 'ic_launcher.png' -print -quit)"
          fi
          if [ -z "$ICON_FILE" ]; then
            echo "::error::Nie znaleziono ikony ic_launcher.png w ZIP."
            exit 1
          fi
          mkdir -p assets
          cp "$ICON_FILE" assets/ic_launcher.png
          echo "Użyto ikony: $ICON_FILE"

          BANNER_FILE="$(find extracted -type f -path '*/res/drawable/tv_banner.png' -print -quit || true)"
          if [ -n "$BANNER_FILE" ]; then
            cp "$BANNER_FILE" assets/tv_banner.png
          fi

      - name: Utwórz projekt Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/app
          npm install --save-dev @capacitor/cli
          npx cap init "Tablica operacyjna" "pl.pajurawski.tablicaoperacyjna" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Ustaw ikonę WTRYSKARKI i obsługę Android TV
        shell: bash
        run: |
          set -euo pipefail
          RES="android/app/src/main/res"
          mkdir -p "$RES/drawable-nodpi" "$RES/drawable"
          cp assets/ic_launcher.png "$RES/drawable-nodpi/ic_launcher_foreground.png"

          # Ikony zwykłe dla starszych launcherów Androida.
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$density"
            case "$density" in
              mdpi) size=48 ;;
              hdpi) size=72 ;;
              xhdpi) size=96 ;;
              xxhdpi) size=144 ;;
              xxxhdpi) size=192 ;;
            esac
            # Użyj pełnej grafiki jako ikony w każdym zagęszczeniu.
            cp assets/ic_launcher.png "$RES/mipmap-$density/ic_launcher.png"
            cp assets/ic_launcher.png "$RES/mipmap-$density/ic_launcher_round.png"
          done
          cp assets/ic_launcher.png "$RES/mipmap-nodpi/ic_launcher.png"

          # Kluczowa poprawka: Android 8+ używa adaptive-icon XML,
          # więc oba pliki muszą wskazywać na naszą grafikę, a nie domyślny symbol Capacitor.
          mkdir -p "$RES/mipmap-anydpi-v26"
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/black" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          if [ -f assets/tv_banner.png ]; then
            cp assets/tv_banner.png "$RES/drawable/tv_banner.png"
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p = "android/app/src/main/AndroidManifest.xml"
          android = "{http://schemas.android.com/apk/res/android}"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(p)
          root = tree.getroot()
          app = root.find("application")
          if app is None:
              raise SystemExit("Brak elementu application w manifeście")
          app.set(android + "icon", "@mipmap/ic_launcher")
          app.set(android + "roundIcon", "@mipmap/ic_launcher_round")
          activity = None
          for item in app.findall("activity"):
              for filt in item.findall("intent-filter"):
                  actions = [x.get(android + "name") for x in filt.findall("action")]
                  cats = [x.get(android + "name") for x in filt.findall("category")]
                  if "android.intent.action.MAIN" in actions and "android.intent.category.LAUNCHER" in cats:
                      activity = item
                      break
              if activity is not None:
                  break
          if activity is None:
              raise SystemExit("Nie znaleziono aktywności MAIN/LAUNCHER")
          activity.set(android + "icon", "@mipmap/ic_launcher")
          if __import__("os").path.exists("android/app/src/main/res/drawable/tv_banner.png"):
              activity.set(android + "banner", "@drawable/tv_banner")
          leanback = ET.SubElement(activity, "intent-filter")
          ET.SubElement(leanback, "action", {android + "name": "android.intent.action.MAIN"})
          ET.SubElement(leanback, "category", {android + "name": "android.intent.category.LEANBACK_LAUNCHER"})
          tree.write(p, encoding="utf-8", xml_declaration=True)
          PY

      - name: Włącz pełny ekran Android
        shell: bash
        run: |
          set -euo pipefail
          MAIN_ACTIVITY="$(find android/app/src/main/java -type f -name 'MainActivity.java' -print -quit)"
          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "::error::Nie znaleziono MainActivity.java"
            exit 1
          fi
          PACKAGE="$(sed -n 's/^package \(.*\);/\1/p' "$MAIN_ACTIVITY" | head -n 1)"
          cat > "$MAIN_ACTIVITY" <<EOF
          package $PACKAGE;

          import android.os.Bundle;
          import android.view.View;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  hideSystemUI();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemUI();
              }

              private void hideSystemUI() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );
              }
          }
          EOF

      - name: Zbuduj APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Udostępnij APK
        uses: actions/upload-artifact@v4
        with:
          name: Tablica-operacyjna-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
